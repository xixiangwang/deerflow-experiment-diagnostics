<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>实验诊断 · DeerFlow</title><link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <header><span class="eyebrow">DEERFLOW / EXPERIMENT LAB</span><h1>先找到证据，再讨论修改。</h1>
    <p>提交实验日志、配置与代码摘录，由 DeerFlow 调用检查和文档检索工具，给出诊断与验证计划。</p></header>
  <div class="notice"><strong>材料诊断 · 只读模式</strong><span>本入口不会执行代码或应用修复。所填材料经常见密钥脱敏后会发送给已配置的模型服务；请先移除私有信息。</span></div>
  <div class="layout">
    <section class="card inputs"><div class="section-title"><h2>实验材料</h2><button id="sample" type="button" class="quiet">填入示例</button></div>
      <form id="material-form">
        <label>访问口令<input id="access" type="password" autocomplete="off" placeholder="启动链接可自动填入，区别于模型 API Key"></label>
        <label>想排查的问题<textarea id="question" rows="2" maxlength="3000" placeholder="例如：这个报错与 LoRA 配置有什么关系？"></textarea></label>
        <label>日志<textarea id="log" rows="9" maxlength="100000" spellcheck="false" placeholder="保留完整错误栈和错误前的日志"></textarea></label>
        <div class="pair"><label>实验配置 · JSON<textarea id="config" rows="7" spellcheck="false">{}</textarea></label>
          <label>环境信息 · JSON<textarea id="environment" rows="7" spellcheck="false">{"versions": {}}</textarea></label></div>
        <label>代码摘录 · 可选<textarea id="code" rows="5" maxlength="50000" spellcheck="false" placeholder="只做静态分析，不执行"></textarea></label>
        <div class="actions"><button id="submit" type="submit">提交诊断 <span aria-hidden="true">↗</span></button><span id="status" role="status" aria-live="polite">等待提交</span></div>
      </form>
    </section>
    <section class="card results" aria-live="polite"><div class="section-title"><h2>诊断报告</h2><div><button id="resume" class="quiet" disabled>恢复上次报告</button> <button id="download" class="quiet" disabled>下载记录</button></div></div>
      <div id="empty"><div class="empty-mark">◎</div><h3>让每条建议都有出处</h3><p>报告将区分已观察到的现象、原因假设与待执行的验证步骤。</p><p class="subtle">任务依次处理；关闭页面后，本次任务仍会在服务端继续。</p></div>
      <div id="result" hidden></div>
    </section>
  </div>
  <footer>官方 DeerFlow v2.0.0 · 场景工具与技能扩展 · 本地单用户演示入口</footer>
</main>
</body></html>
